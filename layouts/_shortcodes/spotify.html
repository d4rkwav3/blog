<iframe 
    data-testid="embed-iframe"
    style="border-radius:12px"
    src="https://open.spotify.com/embed/{{.Get 0}}/{{.Get 1}}?utm_source=generator"
    width="100%"
    {{ if eq (.Get 0) "track" }}
        height="152"
    {{ else }}
        height="600"
    {{ end }}
    frameBorder="0"
    allowfullscreen=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy">
</iframe>
